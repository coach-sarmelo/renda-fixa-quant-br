name: Network

on:
  schedule:
    # Segundas 06:00 UTC (03:00 BRT) — roda a suíte network
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  # Suíte @pytest.mark.network isolada do ci.yml: falhas transitórias em
  # endpoints externos (Tesouro Oficial ~14,5 MB, CVM ~11 MB, SGS série 12)
  # não bloqueiam PRs nem deixam o badge principal de CI vermelho.
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run network tests
        run: pytest -m network --no-cov -ra
